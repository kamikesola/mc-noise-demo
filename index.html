<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <title>噪声地形演示 · MC Noise Demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #87ceeb;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        user-select: none;
      }

      canvas {
        display: block;
      }

      #hud {
        position: fixed;
        left: 18px;
        top: 18px;
        max-width: 640px;
        padding: 14px 18px 12px;
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 10px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
        pointer-events: none;
        line-height: 1.6;
      }

      #title {
        margin-bottom: 4px;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      #formula {
        color: #9fe3ff;
        font-family: Consolas, "Courier New", monospace;
        font-size: 14px;
      }

      #hint {
        margin-top: 6px;
        color: #ffe08a;
        font-size: 14px;
      }

      #meta {
        margin-top: 6px;
        color: #bbbbbb;
        font-size: 12px;
      }

      .keys {
        margin-top: 10px;
        padding-top: 8px;
        color: #dddddd;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        font-size: 12px;
      }

      .keys b {
        color: #ffffff;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="title"></div>
      <div id="formula"></div>
      <div id="hint"></div>
      <div id="meta"></div>
      <div class="keys">
        <b>1</b> 随机 · <b>2</b> 正弦 · <b>3</b> 插值 · <b>4</b> 3D噪声 ·
        <b>5</b> 多八度 · <b>6</b> NormalNoise · <b>R</b> 换种子 ·
        <b>H</b> 隐藏面板 · <b>V</b> 重置视角 · 拖拽旋转 · 滚轮缩放
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
